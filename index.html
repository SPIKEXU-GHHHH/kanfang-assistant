<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>看房对比助手</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
--primary:#4A90D9;--primary-dark:#3a7bc8;--primary-light:#e8f1fb;
--success:#52c41a;--success-bg:#f0fbeb;
--warning:#faad14;--warning-bg:#fffbe6;
--danger:#ff4d4f;--danger-bg:#fff1f0;
--bg:#f0f2f5;--card:#ffffff;--border:#e8e8e8;
--text:#333;--text-2:#666;--text-3:#999;
--radius:12px;--shadow:0 2px 8px rgba(0,0,0,.08);
--safe-bottom:env(safe-area-inset-bottom,0px)
}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased}

/* Header */
.header{position:fixed;top:0;left:0;right:0;height:52px;background:var(--primary);color:#fff;display:flex;align-items:center;padding:0 12px;z-index:100;box-shadow:0 2px 6px rgba(74,144,217,.3)}
.header-title{font-size:17px;font-weight:600;position:absolute;left:50%;transform:translateX(-50%);pointer-events:none}
.header-right{margin-left:auto;display:flex;gap:4px}
.header-btn{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border:none;background:transparent;color:#fff;font-size:20px;cursor:pointer;border-radius:8px}
.header-btn:active{background:rgba(255,255,255,.2)}

/* View Toggle - 3 tabs */
.view-toggle{position:fixed;top:52px;left:0;right:0;background:var(--card);display:flex;border-bottom:1px solid var(--border);z-index:99}
.view-toggle button{flex:1;padding:10px 4px;border:none;background:transparent;color:var(--text-3);font-size:13px;cursor:pointer;border-bottom:2px solid transparent;transition:all .2s}
.view-toggle button.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}

/* Filter Bar */
.filter-bar{position:fixed;top:97px;left:0;right:0;background:var(--card);padding:8px 12px;display:flex;gap:8px;z-index:98;border-bottom:1px solid var(--border);overflow-x:auto;white-space:nowrap}
.filter-bar::-webkit-scrollbar{display:none}
.filter-chip{padding:5px 12px;border-radius:16px;border:1px solid var(--border);background:var(--card);color:var(--text-2);font-size:12px;cursor:pointer;flex-shrink:0;transition:all .2s}
.filter-chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}

/* Main Content */
.main{padding-top:141px;padding-bottom:80px;height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch}
.main.no-filter{padding-top:97px}

/* Card View */
.card-list{padding:8px 12px}
.swipe-wrapper{position:relative;margin-bottom:10px;overflow:hidden;border-radius:var(--radius);transform:translateZ(0)}
.swipe-content{position:relative;z-index:1;background:var(--card);will-change:transform}
.swipe-content.swiped{transform:translateX(-80px)}
.swipe-delete{position:absolute;top:0;right:0;bottom:0;width:80px;background:var(--danger);color:#fff;border:none;font-size:14px;font-weight:600;cursor:pointer;z-index:0;border-radius:0 var(--radius) var(--radius) 0;opacity:0;transition:opacity .2s}
.apartment-card{background:var(--card);border-radius:var(--radius);padding:14px;margin-bottom:0;box-shadow:var(--shadow);cursor:pointer;position:relative;overflow:hidden}
.apartment-card:active{opacity:.92}
.card-photo-preview{width:100%;height:120px;border-radius:8px;overflow:hidden;margin-bottom:10px;display:flex;gap:2px}
.card-photo-preview img{flex:1;height:100%;object-fit:cover;min-width:0}
.card-photo-preview img:nth-child(n+4){display:none}
.card-photo-preview .more-photos{flex:0 0 40px;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.5);color:#fff;font-size:12px;border-radius:4px;margin-left:2px}
.card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.card-name{font-size:16px;font-weight:600;color:var(--text)}
.card-rent{font-size:18px;font-weight:700;color:var(--primary)}
.card-rent small{font-size:11px;font-weight:400;color:var(--text-3)}
.card-address{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:8px;padding:4px 0}
.addr-text{font-size:12px;color:var(--text-2);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.addr-nav{font-size:11px;color:var(--primary);font-weight:600;white-space:nowrap;flex-shrink:0;padding:4px 10px;background:var(--primary-light);border-radius:4px;cursor:pointer;transition:all .15s;user-select:none}
.addr-nav:active{transform:scale(.9);background:var(--primary);color:#fff}
.card-info{display:flex;flex-wrap:wrap;gap:4px 12px;margin-bottom:8px}
.card-info span{font-size:12px;color:var(--text-2)}
.card-info span::before{content:"·";margin-right:6px;color:var(--text-3)}
.card-info span:first-child::before{display:none}
.card-bottom{display:flex;justify-content:space-between;align-items:center;padding-top:8px;border-top:1px solid var(--border)}
.card-score{display:flex;align-items:center;gap:4px}
.score-badge{background:var(--primary-light);color:var(--primary);padding:2px 8px;border-radius:10px;font-size:12px;font-weight:600}
.card-tags{display:flex;gap:4px}
.tag{padding:2px 8px;border-radius:10px;font-size:11px;font-weight:500}
.tag-like{background:var(--success-bg);color:var(--success)}
.tag-backup{background:var(--warning-bg);color:var(--warning)}
.tag-exclude{background:var(--danger-bg);color:var(--danger)}
.tag-revisit{background:#e6f7ff;color:#1890ff}
.revisit-icon{position:absolute;top:10px;right:10px;font-size:14px}

/* Empty State */
.empty-state{text-align:center;padding:60px 20px;color:var(--text-3)}
.empty-state .icon{font-size:48px;margin-bottom:12px}
.empty-state p{font-size:14px;margin-bottom:16px}
.empty-state button{padding:8px 24px;background:var(--primary);color:#fff;border:none;border-radius:20px;font-size:14px;cursor:pointer}

/* Table View */
.table-wrap{overflow-x:auto;padding:8px;-webkit-overflow-scrolling:touch}
.table-wrap table{border-collapse:collapse;font-size:12px;min-width:100%}
.table-wrap th{position:sticky;top:0;background:var(--primary);color:#fff;padding:8px 10px;text-align:left;font-weight:500;white-space:nowrap;min-width:80px;z-index:5}
.table-wrap th:first-child{position:sticky;left:0;z-index:6;min-width:90px}
.table-wrap td{padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap;color:var(--text-2)}
.table-wrap td:first-child{position:sticky;left:0;background:var(--card);font-weight:600;color:var(--text);z-index:4}
.table-wrap tr:active td{background:var(--primary-light)}
.table-wrap .td-score{font-weight:600;color:var(--primary)}

/* FAB */
.fab{position:fixed;bottom:20px;right:20px;width:52px;height:52px;border-radius:50%;background:var(--primary);color:#fff;border:none;font-size:28px;cursor:pointer;box-shadow:0 4px 12px rgba(74,144,217,.4);z-index:50;display:flex;align-items:center;justify-content:center;transition:transform .15s}
.fab:active{transform:scale(.9)}

/* Modal */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:200;display:none;opacity:0;transition:opacity .2s}
.modal-overlay.show{display:block;opacity:1}
.modal{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--bg);z-index:201;display:none;flex-direction:column;transform:translateY(100%);transition:transform .25s ease-out}
.modal.show{display:flex;transform:translateY(0)}
.modal-header{height:48px;background:var(--primary);color:#fff;display:flex;align-items:center;padding:0 12px;flex-shrink:0}
.modal-header .back-btn{background:transparent;border:none;color:#fff;font-size:22px;cursor:pointer;padding:4px 8px}
.modal-header h2{flex:1;font-size:16px;font-weight:600;text-align:center;margin-right:44px}
.modal-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px}

/* Map */
#mapCanvas{width:100%;height:calc(100vh - 220px);border-radius:8px}
.map-co-row{display:flex;gap:8px;margin-bottom:10px}
.map-co-row input{flex:1}
.map-hint{font-size:12px;color:var(--text-3);margin-bottom:10px;display:flex;gap:12px}
.map-hint i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:3px}
.map-loading{display:flex;align-items:center;justify-content:center;height:200px;color:var(--text-3);font-size:14px}

/* 全屏图片查看器 */
.photo-viewer{position:fixed;top:0;left:0;right:0;bottom:0;background:#000;z-index:301;display:none;flex-direction:column}
.photo-viewer.show{display:flex}
.photo-viewer-back{position:absolute;top:12px;left:12px;width:40px;height:40px;background:rgba(0,0,0,.5);border:none;color:#fff;font-size:24px;border-radius:50%;z-index:2;cursor:pointer;display:flex;align-items:center;justify-content:center}
.photo-viewer-back:active{background:rgba(0,0,0,.8)}
#photoViewerImg{width:100%;height:100%;object-fit:contain;padding-top:56px;box-sizing:border-box}

/* Form */
.form-section{background:var(--card);border-radius:var(--radius);padding:12px;margin-bottom:10px}
.form-section-title{font-size:14px;font-weight:600;color:var(--primary);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:6px}
.form-group{margin-bottom:12px}
.form-group:last-child{margin-bottom:0}
.form-row{display:flex;gap:10px}
.form-row .form-group{flex:1}
.form-label{display:block;font-size:13px;color:var(--text-2);margin-bottom:4px}
.form-input,.form-select,.form-textarea{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:14px;color:var(--text);background:var(--card);outline:none;transition:border-color .2s}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--primary)}
.form-textarea{resize:vertical;min-height:60px;line-height:1.5}
.form-input::placeholder,.form-textarea::placeholder{color:var(--text-3)}

/* Star Rating */
.stars{display:flex;gap:4px}
.star{font-size:24px;color:#ddd;cursor:pointer;user-select:none;transition:color .1s}
.star.active{color:var(--warning)}
.score-label{font-size:12px;color:var(--text-3);margin-top:2px}

/* Intention Selector */
.intention-group{display:flex;gap:8px}
.intention-btn{flex:1;padding:8px;border:1px solid var(--border);border-radius:8px;background:var(--card);text-align:center;font-size:13px;cursor:pointer;transition:all .2s}
.intention-btn.active[data-val="like"]{background:var(--success-bg);border-color:var(--success);color:var(--success)}
.intention-btn.active[data-val="backup"]{background:var(--warning-bg);border-color:var(--warning);color:var(--warning)}
.intention-btn.active[data-val="exclude"]{background:var(--danger-bg);border-color:var(--danger);color:var(--danger)}
.intention-btn.active[data-val="pending"]{background:var(--primary-light);border-color:var(--primary);color:var(--primary)}

/* Toggle Switch */
.toggle-switch{display:inline-flex;align-items:center;gap:8px}
.switch{position:relative;width:44px;height:24px;background:#ccc;border-radius:12px;cursor:pointer;transition:background .2s}
.switch.on{background:var(--success)}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;background:#fff;border-radius:50%;transition:left .2s}
.switch.on::after{left:22px}

/* Photo Upload */
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.photo-item{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:var(--bg)}
.photo-item img{width:100%;height:100%;object-fit:cover}
.photo-delete{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;border:none;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.photo-add{aspect-ratio:1;border:1px dashed var(--border);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;color:var(--text-3);background:var(--bg)}
.photo-add span{font-size:12px;margin-top:2px}

/* Subway Line Tags */
.subway-lines-container{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.subway-line-tag{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:12px;font-size:12px;font-weight:600;color:#fff;cursor:pointer}
.subway-line-tag .remove-line{opacity:.7;font-size:14px;margin-left:2px}
.subway-line-tag .remove-line:active{opacity:1}
.subway-add-btn{padding:4px 10px;border:1px dashed var(--border);border-radius:12px;font-size:12px;color:var(--text-3);cursor:pointer;background:var(--bg)}

/* Custom Fee Row */
.custom-fee-row{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.custom-fee-row .fee-name{flex:1}
.custom-fee-row .fee-amount{width:100px}
.custom-fee-row .fee-delete{width:32px;height:32px;border:none;background:var(--danger-bg);color:var(--danger);border-radius:8px;font-size:16px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.add-fee-btn{width:100%;padding:8px;border:1px dashed var(--border);border-radius:8px;background:transparent;color:var(--text-3);font-size:13px;cursor:pointer}
.add-fee-btn:active{background:var(--bg)}

/* Cost Formula Detail */
.cost-summary{background:var(--primary-light);border-radius:8px;padding:10px;margin-top:8px}
.cost-row{display:flex;justify-content:space-between;font-size:13px;padding:2px 0;color:var(--text-2)}
.cost-formula{font-size:11px;color:var(--text-3);padding:1px 0 3px 8px;line-height:1.4}
.cost-discount{color:var(--success)}
.cost-total{font-size:16px;font-weight:700;color:var(--primary);border-top:1px dashed var(--primary);margin-top:6px;padding-top:6px}

/* Detail View */
.detail-card{background:var(--card);border-radius:var(--radius);padding:14px;margin-bottom:10px}
.detail-card h3{font-size:14px;color:var(--primary);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.detail-row{display:flex;padding:4px 0;font-size:13px}
.detail-label{color:var(--text-3);width:90px;flex-shrink:0}
.detail-value{color:var(--text);flex:1}
.detail-photos{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}
.detail-photos img{width:100%;border-radius:8px;aspect-ratio:4/3;object-fit:cover}
.detail-notes{background:var(--primary-light);border-radius:8px;padding:10px;font-size:13px;color:var(--text);line-height:1.6;white-space:pre-wrap}
.detail-score-box{display:flex;justify-content:space-around;align-items:center}
.score-item{text-align:center}
.score-item .val{font-size:20px;font-weight:700}
.score-item .lbl{font-size:11px;color:var(--text-3);margin-top:2px}
.subway-tag-detail{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;font-weight:600;color:#fff;margin-right:4px}

/* Settings */
.weight-row{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.weight-label{width:70px;font-size:13px;color:var(--text-2);flex-shrink:0}
.weight-slider{flex:1;height:6px;background:var(--border);border-radius:3px;-webkit-appearance:none;appearance:none;outline:none}
.weight-slider::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--primary);cursor:pointer;box-shadow:0 2px 4px rgba(0,0,0,.2)}
.weight-value{width:36px;text-align:right;font-size:13px;font-weight:600;color:var(--primary)}
.weight-total{text-align:center;padding:10px;font-size:13px;color:var(--text-2);border-radius:8px;background:var(--bg);margin-top:8px}
.weight-total.ok{color:var(--success)}
.weight-total.err{color:var(--danger)}

/* Export Options */
.export-btn{display:block;width:100%;padding:12px;text-align:left;border:1px solid var(--border);border-radius:8px;background:var(--card);margin-bottom:8px;cursor:pointer;font-size:14px;color:var(--text)}
.export-btn:active{background:var(--bg)}
.export-btn .desc{font-size:12px;color:var(--text-3);margin-top:2px}

/* Action Buttons */
.btn{padding:10px 16px;border:none;border-radius:8px;font-size:14px;cursor:pointer;text-align:center;transition:opacity .2s}
.btn:active{opacity:.7}
.btn-primary{background:var(--primary);color:#fff}
.btn-danger{background:var(--danger);color:#fff}
.btn-outline{background:var(--card);color:var(--text);border:1px solid var(--border)}
.btn-block{display:block;width:100%}

/* Detail Actions */
.detail-actions{display:flex;gap:8px;padding:0 12px 20px}
.detail-actions .btn{flex:1}

/* Toast */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.75);color:#fff;padding:8px 20px;border-radius:20px;font-size:13px;z-index:300;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}

/* Confirm Dialog */
.confirm-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:400;display:none;align-items:center;justify-content:center}
.confirm-overlay.show{display:flex}
.confirm-box{background:var(--card);border-radius:12px;padding:20px;width:80%;max-width:300px;text-align:center}
.confirm-box p{margin-bottom:16px;font-size:14px}
.confirm-box .btns{display:flex;gap:8px}
.confirm-box .btns .btn{flex:1}

/* Checklist */
.checklist-container{padding:8px 12px}
.checklist-summary{background:var(--card);border-radius:var(--radius);padding:14px;margin-bottom:10px;box-shadow:var(--shadow);text-align:center}
.checklist-progress-bar{width:100%;height:8px;background:var(--bg);border-radius:4px;margin-top:8px;overflow:hidden}
.checklist-progress-fill{height:100%;background:var(--success);border-radius:4px;transition:width .3s}
.checklist-group{margin-bottom:12px}
.checklist-group-header{display:flex;align-items:center;gap:6px;padding:8px 12px;background:var(--primary-light);border-radius:8px;margin-bottom:6px;font-size:13px;font-weight:600;color:var(--primary)}
.checklist-group-count{margin-left:auto;font-size:11px;color:var(--text-3);font-weight:400}
.checklist-item{background:var(--card);border-radius:var(--radius);padding:10px 12px;margin-bottom:6px;box-shadow:var(--shadow);display:flex;align-items:flex-start;gap:8px;cursor:pointer;transition:transform .15s,box-shadow .15s;position:relative}
.checklist-checkbox{width:20px;height:20px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;margin-top:1px;transition:all .2s}
.checklist-checkbox.checked{background:var(--success);border-color:var(--success)}
.checklist-content{flex:1;min-width:0}
.checklist-title-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.checklist-title{font-size:13px;font-weight:500;color:var(--text);word-break:break-word}
.checklist-drag-handle{width:22px;flex-shrink:0;cursor:grab;color:var(--text-3);display:flex;align-items:center;justify-content:center;font-size:18px;padding-top:1px;touch-action:none;user-select:none;-webkit-user-select:none;line-height:1}
.checklist-drag-handle:active{cursor:grabbing}
.checklist-item.checklist-dragging{z-index:10;box-shadow:0 4px 14px rgba(0,0,0,.18);opacity:.96}
.checklist-item.checklist-drag-ghost{background:var(--primary-light)}
.checklist-qty{font-size:12px;font-weight:600;color:var(--primary);flex-shrink:0}
.checklist-transport{font-size:10px;padding:1px 6px;border-radius:8px;font-weight:500;flex-shrink:0;white-space:nowrap}
.checklist-transport[data-t="行李携带"]{background:#e6f7ff;color:#1890ff}
.checklist-transport[data-t="当地购买"]{background:var(--success-bg);color:var(--success)}
.checklist-transport[data-t="皆可"]{background:var(--warning-bg);color:var(--warning)}
.checklist-notes{font-size:11px;color:var(--text-3);margin-top:2px;line-height:1.4}
.checklist-delete{width:26px;height:26px;border:none;background:transparent;color:var(--text-3);font-size:16px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;border-radius:6px}
.checklist-delete:active{background:var(--danger-bg);color:var(--danger)}
.checklist-add-form{background:var(--card);border-radius:var(--radius);padding:12px;margin-bottom:8px;box-shadow:var(--shadow)}
.checklist-category-filter{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.checklist-cat-chip{padding:3px 10px;border-radius:12px;font-size:11px;border:1px solid var(--border);background:var(--card);color:var(--text-2);cursor:pointer}
.checklist-cat-chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.checklist-edit-btn{width:26px;height:26px;border:none;background:transparent;color:var(--text-3);font-size:14px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;border-radius:6px}
.checklist-edit-btn:active{background:var(--primary-light);color:var(--primary)}
.checklist-edit-form{background:var(--primary-light);border-radius:8px;padding:10px;margin-bottom:6px}
.checklist-edit-form .form-row{margin-bottom:8px}
.checklist-edit-form .form-group{margin-bottom:8px}

// IndexedDB wrapper (1GB+ storage vs 5MB localStorage)
let _idb = null;
function _openDB(){
if(_idb) return Promise.resolve(_idb);
return new Promise((resolve, reject) => {
const r = indexedDB.open(DB_NAME, 1);
r.onupgradeneeded = function(e){ e.target.result.createObjectStore('kv'); };
r.onsuccess = function(e){ _idb = e.target.result; _idb.onclose = ()=>{_idb=null}; resolve(_idb); };
r.onerror = function(e){ reject(e.target.error); };
});
}
function _dbGet(key){ return _openDB().then(db=>new Promise((resolve,reject)=>{
const tx=db.transaction('kv','readonly'); const r=tx.objectStore('kv').get(key);
r.onsuccess=()=>resolve(r.result); r.onerror=e=>reject(e.target.error);
}));}
function _dbSet(key,val){ return _openDB().then(db=>new Promise((resolve,reject)=>{
const tx=db.transaction('kv','readwrite'); tx.objectStore('kv').put(val,key);
tx.oncomplete=()=>resolve(); tx.onerror=e=>reject(e.target.error);
}));}
function _dbDel(key){ return _openDB().then(db=>new Promise((resolve,reject)=>{
const tx=db.transaction('kv','readwrite'); tx.objectStore('kv').delete(key);
tx.oncomplete=()=>resolve(); tx.onerror=e=>reject(e.target.error);
}));}

async function loadData(){
try{
// IndexedDB first, fallback to localStorage for migration
let d = await _dbGet(STORAGE_KEY).catch(()=>null);
if(!d){
d = localStorage.getItem(STORAGE_KEY);
if(d){
// One-time migration: copy all data from localStorage to IndexedDB
const p = [_dbSet(STORAGE_KEY, d)];
const w = localStorage.getItem(WEIGHT_KEY); if(w) p.push(_dbSet(WEIGHT_KEY, w));
const cl = localStorage.getItem(CHECKLIST_KEY); if(cl) p.push(_dbSet(CHECKLIST_KEY, cl));
const ca = localStorage.getItem(COMPANY_KEY); if(ca) p.push(_dbSet(COMPANY_KEY, ca));
await Promise.all(p);
}
}
if(d) apartments = JSON.parse(d);
const w = await _dbGet(WEIGHT_KEY).catch(()=>null);
if(w) weights = JSON.parse(w);
const cl = await _dbGet(CHECKLIST_KEY).catch(()=>null);
if(cl) checklist = JSON.parse(cl);
// Migrate transport values
let migrated = false;
checklist.forEach(c=>{
if(c.transport==='行李'){c.transport='行李携带';migrated=true}
if(c.transport==='当地'){c.transport='当地购买';migrated=true}
});
if(migrated) await saveData();
// Migrate old data
const old = localStorage.getItem('apartment_compare_data_v1');
if(old && apartments.length===0){
apartments = JSON.parse(old);
await saveData();
localStorage.removeItem('apartment_compare_data_v1');
}
}catch(e){console.error('Load error:',e)}
const ca = await _dbGet(COMPANY_KEY).catch(()=>null);
if(ca){ try{ const d=JSON.parse(ca); companyAddress=d.addr||''; companyLat=d.lat; companyLng=d.lng; }catch(e){ companyAddress=ca; } }
initDefaultChecklist();
}

async function saveData(){
try{
const json = JSON.stringify(apartments);
const sizeKB = Math.round(json.length/1024);
await Promise.all([
_dbSet(STORAGE_KEY, json),
_dbSet(WEIGHT_KEY, JSON.stringify(weights)),
_dbSet(CHECKLIST_KEY, JSON.stringify(checklist))
]);
if(sizeKB > 4000) showToast('数据已'+sizeKB+'KB');
return true;
}catch(e){
showToast('存储失败，请检查浏览器存储空间');
console.error('Save error:', e);
return false;
}
}

// ============ Utility Cost Formula ============
function calcUtilityCost(apt){
const area = parseFloat(apt.area)||0;
const residents = parseInt(apt.residentCount)||1;
const elecPrice = parseFloat(apt.electricityUnitPrice)||0.62;
// Electricity: area-based (lighting+AC for space) + per-person (devices+bedroom AC)
const elecKwh = area * 2 + residents * 40; // 度/月
const elecCost = elecKwh * elecPrice;
// Water: support combined or split cold/hot
const waterSplit = apt.waterSplit === true || apt.waterSplit === 'true';
let waterCost, waterInfo;
if(waterSplit){
const coldPrice = parseFloat(apt.coldWaterPrice)||3.5;
const hotPrice = parseFloat(apt.hotWaterPrice)||25;
const coldTons = residents * 3 + 2; // 冷水吨/月
const hotTons = residents * 2 + 1; // 热水吨/月
const coldCost = coldTons * coldPrice;
const hotCost = hotTons * hotPrice;
waterCost = coldCost + hotCost;
waterInfo = {
split:true,
coldTons, coldPrice, coldCost,
hotTons, hotPrice, hotCost,
tons: coldTons + hotTons
};
}else{
const waterPrice = parseFloat(apt.waterPrice)||5;
const waterTons = residents * 3 + 2; // 吨/月
waterCost = waterTons * waterPrice;
waterInfo = {split:false, tons:waterTons, price:waterPrice, cost:waterCost};
}
// Gas: per-person
const gasM3 = residents * 8; // m³/月
const gasCost = gasM3 * 3.5; // 3.5元/m³
const monthly = elecCost + waterCost + gasCost;
// Build detail string
let waterDetail;
if(waterSplit){
waterDetail = `冷水:(${residents}人×3吨/人+2吨)×${waterInfo.coldPrice}元/吨=${waterInfo.coldTons}吨×${waterInfo.coldPrice}元/吨=${waterInfo.coldCost.toFixed(1)}元 | 热水:(${residents}人×2吨/人+1吨)×${waterInfo.hotPrice}元/吨=${waterInfo.hotTons}吨×${waterInfo.hotPrice}元/吨=${waterInfo.hotCost.toFixed(1)}元`;
}else{
waterDetail = `水费:(${residents}人×3吨/人+2吨)×${waterInfo.price}元/吨=${waterInfo.tons}吨×${waterInfo.price}元/吨=${waterCost.toFixed(1)}元`;
}
return {
electricity:{kwh:elecKwh, price:elecPrice, cost:elecCost},
water:waterInfo,
gas:{m3:gasM3, price:3.5, cost:gasCost},

};

// ============ Score Calculation ============
function calcTotalScore(apt){
const s = apt.scores || {price:3,location:3,condition:3,commute:3,surrounding:3};
const total = (s.price*weights.price + s.location*weights.location + s.condition*weights.condition + s.commute*weights.commute + s.surrounding*weights.surrounding) / 100;
return Math.round(total * 10) / 10;
}

function calcAnnualCost(apt){
const rent = parseFloat(apt.rent)||0;
const property = parseFloat(apt.propertyFee)||0;
const commute = parseFloat(apt.commuteCost)||0;
const tax = parseFloat(apt.tax)||0;
const utility = calcUtilityCost(apt);
const customFees = apt.customFees || [];
const customTotal = customFees.reduce((sum,f)=>sum + (parseFloat(f.amount)||0), 0);
const discount = parseFloat(apt.discount)||0;
const monthlyTotal = rent + property + commute + tax + utility.monthly + customTotal - discount;
return {
rent: rent*12,
property: property*12,
commute: commute*12,
tax: tax*12,
utility: utility.monthly*12,
utilityMonthly: utility.monthly,
utilityDetail: utility,
custom: customTotal*12,
customMonthly: customTotal,
discount: discount*12,
total: monthlyTotal*12,
monthlyTotal: monthlyTotal
};
}

// ============ 左滑删除交互（模拟 iOS 短信质感） ============
const SWIPE_THRESHOLD = 40;  // 触发展开的阈值
const SWIPE_WIDTH = 80;      // 删除按钮宽度
const SWIPE_MAX = 120;       // 最大可滑动距离（含阻尼区域）

function bindSwipeToDelete(){
if(isSharedView) return;  // 分享视图不支持左滑删除
const items = document.querySelectorAll('.swipe-content');
items.forEach(item=>{
let startX = 0, startY = 0, currentX = 0, isDragging = false, isHorizontal = false, decided = false;

item.addEventListener('touchstart', function(e){
startX = e.touches[0].clientX;
startY = e.touches[0].clientY;
currentX = 0;
isDragging = true;
decided = false;
isHorizontal = false;
this.style.transition = 'none';
}, {passive:true});

item.addEventListener('touchmove', function(e){
if(!isDragging) return;
const dx = e.touches[0].clientX - startX;
const dy = e.touches[0].clientY - startY;

// 首次移动时判断方向：水平滑动才处理，垂直滑动交给页面滚动
if(!decided){
if(Math.abs(dx) < 18 && Math.abs(dy) < 18) return;
decided = true;
// 垂直方向优先：dy 明显大于 dx 时判定为垂直滚动
isHorizontal = Math.abs(dx) > Math.abs(dy) * 2.0;
if(!isHorizontal){ isDragging = false; return; }
}
if(!isHorizontal) return;

// 计算位移，模拟 iOS 阻尼效果
let x = dx;
// 已展开状态下右滑先抵消偏移量
const offset = this.classList.contains('swiped') ? -SWIPE_WIDTH : 0;
x = dx + offset;

if(x > 0){
// 不允许右滑超过原位
x = 0;
} else if(x < -SWIPE_WIDTH){
// 超过按钮宽度后，施加阻尼：越滑越费力
const over = -x - SWIPE_WIDTH;
x = -SWIPE_WIDTH - over * 0.35;
}
currentX = x;
this.style.transform = `translateX(${x}px)`;
const delBtn = this.nextElementSibling;
if(delBtn && delBtn.classList.contains('swipe-delete')){
delBtn.style.transition = 'none';
delBtn.style.opacity = Math.min(1, Math.abs(x) / SWIPE_WIDTH);
}
}, {passive:true});

item.addEventListener('touchend', function(e){
if(!isDragging) return;
isDragging = false;
this.style.transition = 'transform .35s cubic-bezier(.32,.72,0,1)';

if(currentX < -SWIPE_THRESHOLD){
this.classList.add('swiped');
this.style.transform = 'translateX(-80px)';
}else{
this.classList.remove('swiped');
this.style.transform = 'translateX(0)';
}
const delBtn2 = this.nextElementSibling;
if(delBtn2 && delBtn2.classList.contains('swipe-delete')){
delBtn2.style.transition = 'opacity .2s';
delBtn2.style.opacity = this.classList.contains('swiped') ? '1' : '0';
}
currentX = 0;
}, {passive:true});

// 点击已展开的卡片时收起
item.addEventListener('click', function(e){
if(this.classList.contains('swiped')){
e.preventDefault();
e.stopPropagation();
this.classList.remove('swiped');
this.style.transition = 'transform .35s cubic-bezier(.32,.72,0,1)';
this.style.transform = 'translateX(0)';
const btn = this.nextElementSibling;
if(btn && btn.classList.contains('swipe-delete')){
btn.style.transition = 'opacity .2s';
btn.style.opacity = '0';
}
return false;
}
}, true);
});

// 点击空白区域收起所有展开的卡片
document.addEventListener('click', function(){
document.querySelectorAll('.swipe-content.swiped').forEach(s=>{
s.classList.remove('swiped');
s.style.transition = 'transform .35s cubic-bezier(.32,.72,0,1)';
s.style.transform = 'translateX(0)';
const btn = s.nextElementSibling;
if(btn && btn.classList.contains('swipe-delete')){
btn.style.transition = 'opacity .2s';
btn.style.opacity = '0';
}
});
}, {passive:true});
}

function handlePhotoUpload(event){
const files = event.target.files;
const max = 9 - tempPhotos.length;
const toRead = Math.min(files.length, max);
if(files.length > max) showToast('最多添加9张照片，已添加前'+max+'张');
for(let i=0; i<toRead; i++){
const reader = new FileReader();
reader.onload = function(e){
compressImage(e.target.result, 800, 0.7, function(compressed){
tempPhotos.push(compressed);
renderPhotoGrid();
});
};
reader.readAsDataURL(files[i]);
}
event.target.value = '';
}

function compressImage(dataUrl, maxWidth, quality, callback){
const img = new Image();
img.onload = function(){
try{
const canvas = document.createElement('canvas');
let w = img.width, h = img.height;
if(w > maxWidth){ h = Math.round(h * maxWidth / w); w = maxWidth; }
canvas.width = w; canvas.height = h;
const ctx = canvas.getContext('2d');
ctx.drawImage(img, 0, 0, w, h);
callback(canvas.toDataURL('image/jpeg', quality));
}catch(e){ callback(dataUrl); }
};
img.onerror = function(){ callback(dataUrl); };
img.src = dataUrl;
}

// ============ Cost Preview with Formula ============
function updateCostPreview(){
const rent = parseFloat(document.getElementById('f_rent')?.value)||0;
const area = parseFloat(document.getElementById('f_area')?.value)||0;
const property = parseFloat(document.getElementById('f_propertyFee')?.value)||0;
const tax = parseFloat(document.getElementById('f_tax')?.value)||0;
const commute = parseFloat(document.getElementById('f_commuteCost')?.value)||0;
const residents = parseInt(document.getElementById('f_residentCount')?.value)||1;
const elecPrice = parseFloat(document.getElementById('f_electricityUnitPrice')?.value)||0.62;
const discount = parseFloat(document.getElementById('f_discount')?.value)||0;

// Utility calculation
const elecKwh = area * 2 + residents * 40;
const elecCost = elecKwh * elecPrice;
const waterSplit = document.querySelector('input[name="waterSplit"]:checked')?.value === 'true';
let waterCost, waterFormulaHtml;
if(waterSplit){
const coldPrice = parseFloat(document.getElementById('f_coldWaterPrice')?.value)||3.5;
const hotPrice = parseFloat(document.getElementById('f_hotWaterPrice')?.value)||25;
const coldTons = residents * 3 + 2;
const hotTons = residents * 2 + 1;
const coldCost = coldTons * coldPrice;
const hotCost = hotTons * hotPrice;
waterCost = coldCost + hotCost;
waterFormulaHtml = `<div class="cost-formula">冷水:(${residents}人×3吨/人+2吨)×${coldPrice}元/吨=${coldTons}吨×${coldPrice}元/吨=${coldCost.toFixed(1)}元</div><div class="cost-formula">热水:(${residents}人×2吨/人+1吨)×${hotPrice}元/吨=${hotTons}吨×${hotPrice}元/吨=${hotCost.toFixed(1)}元</div>`;
}else{
const waterPrice = parseFloat(document.getElementById('f_waterPrice')?.value)||5;
const waterTons = residents * 3 + 2;
waterCost = waterTons * waterPrice;
waterFormulaHtml = `<div class="cost-formula">水费:(${residents}人×3吨/人+2吨)×${waterPrice}元/吨=${waterTons}吨×${waterPrice}元/吨=${waterCost.toFixed(1)}元</div>`;
}
const gasM3 = residents * 8;
const gasCost = gasM3 * 3.5;
const utilityMonthly = elecCost + waterCost + gasCost;

// Custom fees
const customTotal = tempCustomFees.reduce((sum,f)=>sum + (parseFloat(f.amount)||0), 0);

const monthlyTotal = rent + property + tax + commute + utilityMonthly + customTotal - discount;
const annualTotal = monthlyTotal * 12;

const preview = document.getElementById('costPreview');
if(monthlyTotal > 0 || rent > 0){
let html = '<div class="cost-summary">';
// Monthly breakdown
html += `<div class="cost-row"><span>月租金</span><span>${rent.toLocaleString()} 元</span></div>`;
html += `<div class="cost-row"><span>月物业费</span><span>${property.toLocaleString()} 元</span></div>`;
html += `<div class="cost-row"><span>月税费</span><span>${tax.toLocaleString()} 元</span></div>`;
html += `<div class="cost-row"><span>月通勤费</span><span>${commute.toLocaleString()} 元</span></div>`;
// Utility with formula
html += `<div class="cost-row"><span>月水电燃气费</span><span>${utilityMonthly.toFixed(1)} 元</span></div>`;
html += `<div class="cost-formula">电费:(${area}㎡×2度/㎡+${residents}人×40度/人)×${elecPrice}元/度=${elecKwh.toFixed(0)}度×${elecPrice}元/度=${elecCost.toFixed(1)}元</div>`;
html += waterFormulaHtml;
html += `<div class="cost-formula">燃气:${residents}人×8m³×3.5元/m³=${gasM3}m³×3.5元/m³=${gasCost}元</div>`;
// Custom fees
if(customTotal > 0){
html += `<div class="cost-row"><span>月其他费用</span><span>${customTotal.toLocaleString()} 元</span></div>`;
tempCustomFees.forEach(f=>{
if(f.name || f.amount){
html += `<div class="cost-formula">${esc(f.name||'未命名')}: ${f.amount||0} 元/月</div>`;
}
});
}
// Discount
if(discount > 0){
html += `<div class="cost-row cost-discount"><span>月折扣/减免</span><span>-${discount.toLocaleString()} 元</span></div>`;
}
html += `<div class="cost-row" style="font-weight:600;border-top:1px solid var(--border);margin-top:4px;padding-top:4px"><span>月均支出</span><span>${monthlyTotal.toLocaleString()} 元</span></div>`;
// Annual breakdown with formulas
html += `<div style="border-top:1px dashed var(--primary);margin-top:8px;padding-top:8px">`;
html += `<div class="cost-row"><span>年租金</span><span>${rent.toLocaleString()}×12=${(rent*12).toLocaleString()} 元</span></div>`;
html += `<div class="cost-row"><span>年物业费</span><span>${property.toLocaleString()}×12=${(property*12).toLocaleString()} 元</span></div>`;
html += `<div class="cost-row"><span>年税费</span><span>${tax.toLocaleString()}×12=${(tax*12).toLocaleString()} 元</span></div>`;
html += `<div class="cost-row"><span>年通勤费</span><span>${commute.toLocaleString()}×12=${(commute*12).toLocaleString()} 元</span></div>`;
html += `<div class="cost-row"><span>年水电燃气费</span><span>${utilityMonthly.toFixed(1)}×12=${(utilityMonthly*12).toFixed(1)} 元</span></div>`;
if(customTotal > 0){
html += `<div class="cost-row"><span>年其他费用</span><span>${customTotal.toLocaleString()}×12=${(customTotal*12).toLocaleString()} 元</span></div>`;
}
if(discount > 0){
html += `<div class="cost-row cost-discount"><span>年折扣/减免</span><span>-${discount.toLocaleString()}×12=-${(discount*12).toLocaleString()} 元</span></div>`;
}
html += `<div class="cost-row cost-total"><span>年度总费用</span><span>${annualTotal.toLocaleString()} 元</span></div>`;
html += `</div></div>`;
preview.innerHTML = html;
}else{
preview.innerHTML = '';
}
}

function navigateTo(id){
const apt = apartments.find(a=>a.id===id);
if(!apt || !apt.address) return;
const addr = encodeURIComponent(apt.address);
const ua = navigator.userAgent;
const isIOS = /iPhone|iPad|iPod/.test(ua);
const isAndroid = /Android/.test(ua);

if(isIOS || isAndroid){
// 手机端：使用高德 App 官方 POI 搜索 scheme（iosamap://poi / androidamap://poi）
const scheme = isIOS
? `iosamap://poi?sourceApplication=kanfang&name=${addr}&dev=0`
: `androidamap://poi?sourceApplication=kanfang&keywords=${addr}&dev=0`;

// 用 visibilitychange 精确判断 App 是否成功打开
let appOpened = false;
function onVisChange(){
if(document.hidden) appOpened = true;
}
document.addEventListener('visibilitychange', onVisChange);

window.location.href = scheme;

// 1.5 秒后检查：如果页面未被隐藏说明 App 未打开，才回退到网页版
setTimeout(function(){
document.removeEventListener('visibilitychange', onVisChange);
if(!appOpened){
window.location.href = `https://uri.amap.com/search?keyword=${addr}&view=map&src=kanfang`;
}
// App 已打开时不做任何跳转，用户返回后直接回到 PWA 主界面
}, 1500);
} else {
// 电脑端：新标签打开高德网页搜索
window.open(`https://uri.amap.com/search?keyword=${addr}&view=map&src=kanfang`, '_blank');
}
}

// ============ 强制刷新（PWA 模式下绕过缓存加载最新版本） ============
async function forceRefresh(){
// 显示刷新提示
const btn = event?.target;
if(btn){ btn.style.transform='rotate(360deg)'; btn.style.transition='transform 0.6s'; }
try{
// 1. 清除 Cache API 中的所有缓存（如果存在）
if('caches' in window){
const keys = await caches.keys();
await Promise.all(keys.map(k=>caches.delete(k)));
}
// 2. 注销所有 Service Worker（如果存在）
if('serviceWorker' in navigator){
const regs = await navigator.serviceWorker.getRegistrations();
await Promise.all(regs.map(r=>r.unregister()));
}
}catch(e){}
// 3. 带时间戳强制重新加载，绕过 HTTP 缓存
const url = location.href.split('?')[0].split('#')[0] + '?v=' + Date.now();
location.href = url;
}

function initMap(){
const body = document.getElementById('mapBody');

'<div class="map-co-row">'+

'</div>'+

'<span><i style="background:var(--primary)"></i> 公司</span>'+

'</div>'+
'<div id="mapCanvas"></div>'+
'</div>';

const map = new AMap.Map('mapCanvas', {
zoom: 12,
center: [113.264435, 23.129163],
resizeEnable: true
});

// 已存公司坐标直接标
if(companyLat != null){
addCompanyMarker(map, companyLng, companyLat);
}

// 标房源
const withCoords = apartments.filter(a=>a.lat != null);
const withoutCoords = apartments.filter(a=>a.lat == null && a.address);
withCoords.forEach(a=>addAptMarker(map, a));
if(withoutCoords.length > 0) geocodeApts(map, withoutCoords);

function locateCompany(){
const addr = document.getElementById('coAddr').value.trim();
if(!addr){ showToast('请输入公司地址'); return; }
companyAddress = addr;
const geocoder = new AMap.Geocoder();
geocoder.getLocation(addr, function(status, result){
if(status==='complete' && result.geocodes.length){
const loc = result.geocodes[0].location;
companyLat = loc.lat; companyLng = loc.lng;
_dbSet(COMPANY_KEY, JSON.stringify({addr:addr, lat:loc.lat, lng:loc.lng}));
if(window._coMarker){ window._mapInstance.remove(window._coMarker); }
addCompanyMarker(window._mapInstance, loc.lng, loc.lat);
window._mapInstance.setFitView();
}else if(status==='error'){
showToast('地理编码失败：请在高德控制台配置Key域名白名单');
console.error('AMap geocode error:', result);
}else{
showToast('未找到该地址，请补充更详细的信息');
}
});
}

function addCompanyMarker(map, lng, lat){
window._coMarker = new AMap.Marker({
position: [lng, lat],
title: '公司',
label: {content:'公司',offset:new AMap.Pixel(0,-20),direction:'top'},
zIndex: 100
});
map.add(window._coMarker);
}

function addAptMarker(map, apt){
const idx = apartments.indexOf(apt) + 1;
const marker = new AMap.Marker({
position: [apt.lng, apt.lat],
title: apt.name || '房源'+idx,
label: {content: String(idx), direction:'center', style:{color:'#fff',fontSize:'11px',fontWeight:'600'}},
zIndex: 50
});
marker.on('click', function(){
const info = '<div style="padding:4px"><b>'+esc(apt.name||'房源'+idx)+'</b><br>'+
'<span style="font-size:12px;color:#666">'+esc(apt.rent||'-')+'元/月 · '+esc(apt.address||'')+'</span></div>';
const iw = new AMap.InfoWindow({content: info, offset: new AMap.Pixel(0, -30)});
iw.open(map, marker.getPosition());
});
map.add(marker);
}

function geocodeApts(map, apts){
const geocoder = new AMap.Geocoder();
let i = 0, errs = 0;
function next(){
if(i >= apts.length){
saveData();
if(errs === apts.length && apts.length > 0) showToast('定位失败：请在高德控制台配置Key域名白名单');
if(window._coMarker || apts.some(a=>a.lat)) map.setFitView();
return;
}
const apt = apts[i];
geocoder.getLocation(apt.address, function(status, result){
if(status==='complete' && result.geocodes.length){
const loc = result.geocodes[0].location;
apt.lat = loc.lat; apt.lng = loc.lng;
addAptMarker(map, apt);
} else if(status==='error'){ errs++; }
i++;
setTimeout(next, 200);
});
}
next();
}

function shareToFriend(){
if(apartments.length === 0){showToast('暂无房源数据可分享');return}

// 将房源数据压缩编码到 URL hash 中
const shareData = {
a: apartments.map(a=>({
n:a.name||'', r:a.rent||'', ar:a.area||'', l:a.layout||'', f:a.floor||'', o:a.orientation||'',
ct:a.commuteTime||'', cm:a.commuteMethod||'', tr:a.needTransfer?1:0, sl:a.subwayLines||[],
d:a.decoration||'', li:a.lighting||'', no:a.noise||'', md:a.metroDistance||'', ad:a.address||'',
rc:a.residentCount||1, i:a.intention||'pending', rv:a.needRevisit?1:0, nt:a.notes||'',
re:a.rent||'', pf:a.propertyFee||'', tx:a.tax||'', eu:a.electricityUnitPrice||'',
wp:a.waterPrice||'', ws:a.waterSplit?1:0, cwp:a.coldWaterPrice||'', hwp:a.hotWaterPrice||'',
cc:a.commuteCost||'', di:a.discount||'', cf:a.customFees||[], sc:a.scores||{}
})),
w: weights
};

try{
const json = JSON.stringify(shareData);
// 使用 btoa + URI 编码，兼容中文
const encoded = btoa(unescape(encodeURIComponent(json)));
const baseUrl = location.href.split('#')[0].split('?')[0];
const shareUrl = baseUrl + '#share=' + encoded;

// 尝试使用 Web Share API（iOS Safari 支持，可直接唤起微信）
if(navigator.share){
navigator.share({
title: '看房对比分享',
text: '我整理了' + apartments.length + '套房源的对比信息，点击查看',
url: shareUrl
}).catch(()=>{
// 用户取消分享，回退到复制链接
copyShareUrl(shareUrl);
});
}else{
// 不支持 Web Share API，复制链接到剪贴板
copyShareUrl(shareUrl);
}
}catch(e){
showToast('生成分享链接失败：' + e.message);
}
}

}

function exportText(){

let text = '🏠 看房对比汇总\n';

text += '房源数量：' + apartments.length + ' 套\n';
text += '═'.repeat(30) + '\n\n';
sorted.forEach((apt, i)=>{
const score = calcTotalScore(apt);
const cost = calcAnnualCost(apt);
const intMap = {like:'❤喜欢',backup:'★备选',exclude:'✕排除',pending:'○待定'};
text += `【${i+1}】${apt.name||'未命名'}\n`;
text += `综合评分：${score}/5  |  意向：${intMap[apt.intention||'pending']}\n`;

text += `通勤：${apt.commuteTime||'-'}分钟（${apt.commuteMethod||'-'}${apt.needTransfer?'，需换乘':''}）\n`;
if(apt.subwayLines && apt.subwayLines.length) text += `地铁线路：${apt.subwayLines.join('→')}\n`;
text += `装修：${apt.decoration||'-'}  |  采光：${apt.lighting||'-'}  |  噪音：${apt.noise||'-'}\n`;
text += `地铁：${apt.metroDistance||'-'}\n`;
if(cost.total > 0){
text += `月均支出：${cost.monthlyTotal.toLocaleString()}元  |  年度总费用：${cost.total.toLocaleString()}元\n`;
}
if(apt.customFees && apt.customFees.length){
text += `其他费用：${apt.customFees.map(f=>f.name+':'+f.amount+'元').join('，')}\n`;
}
if(apt.discount > 0) text += `月折扣：-${apt.discount}元\n`;
if(apt.notes) text += `笔记：${apt.notes}\n`;
text += '─'.repeat(30) + '\n\n';
});
if(checklist.length > 0){
text += '\n📦 租房搬迁准备清单\n';
text += '═'.repeat(30) + '\n';
CHECKLIST_CATEGORIES.forEach(cat=>{
const items = checklist.filter(c=>(c.category||'其他')===cat);
if(items.length === 0) return;
const catDone = items.filter(c=>c.done).length;
text += `\n【${cat}】(${catDone}/${items.length})\n`;
items.forEach(c=>{
const t = c.transport ? getTransportIcon(c.transport)+c.transport : '';
text += `${c.done?'[✓]':'[  ]'} ${c.title}${t?' ('+t+')':''}${c.notes?' - '+c.notes:''}\n`;
});
});
}
if(navigator.clipboard){
navigator.clipboard.writeText(text).then(()=>{
showToast('已复制到剪贴板，可粘贴分享');
}).catch(()=>{
showTextExport(text);

function handleImport(event){
const file = event.target.files[0];
if(!file) return;
const reader = new FileReader();
reader.onload = function(e){
try{
const data = JSON.parse(e.target.result);
if(data.apartments){
apartments = data.apartments;
if(data.weights) weights = data.weights;
if(data.checklist) checklist = data.checklist;
// Migrate transport values on import
checklist.forEach(c=>{
if(c.transport==='行李') c.transport='行李携带';
if(c.transport==='当地') c.transport='当地购买';
});
saveData();
render();
closeExport();
showToast(`已导入 ${apartments.length} 套房源，${checklist.length} 项清单`);
}else{
showToast('文件格式不正确');
}
}catch(err){
showToast('导入失败：文件格式错误');
}
};
reader.readAsText(file);
event.target.value = '';
}

});
}

// ============ Checklist ============
function renderChecklist(){
editingChecklistId = null;
const container = document.getElementById('mainContent');
const doneCount = checklist.filter(c=>c.done).length;
const totalCount = checklist.length;
const progress = totalCount > 0 ? Math.round(doneCount/totalCount*100) : 0;

let html = '<div class="checklist-container">';
if(totalCount > 0){
html += `<div class="checklist-summary">
<div style="font-size:14px;color:var(--text-2)">📦 搬迁准备进度</div>
<div style="font-size:28px;font-weight:700;color:${progress===100?'var(--success)':'var(--primary)'};margin-top:4px">${progress}%</div>
<div style="font-size:12px;color:var(--text-3);margin-top:2px">${doneCount}/${totalCount} 项已完成</div>
<div class="checklist-progress-bar"><div class="checklist-progress-fill" style="width:${progress}%"></div></div>
</div>`;
}

if(totalCount === 0){
html += `<div class="empty-state">
<div class="icon">📝</div>
<p>还没有添加准备事项<br>点击右下角 + 添加待办</p>
</div>`;
}else{
html += renderChecklistGroups();
}
html += '</div>';
container.innerHTML = html;
}

function renderChecklistGroups(){
let html = '';
CHECKLIST_CATEGORIES.forEach(cat=>{
const items = checklist.filter(c=>(c.category||'其他')===cat);
if(items.length === 0) return;
const catDone = items.filter(c=>c.done).length;
html += `<div class="checklist-group">`;
html += `<div class="checklist-group-header">${cat} <span class="checklist-group-count">${catDone}/${items.length}</span></div>`;
const sorted = [...items].sort((a,b)=>{
const oa = a.order!==undefined?a.order:(a.createdAt||0);
const ob = b.order!==undefined?b.order:(b.createdAt||0);
return oa - ob;
});
sorted.forEach(item=>{
html += renderChecklistItem(item);
});
html += `</div>`;
});
return html;
}

const item = checklist.find(c=>c.id===id);
if(!item) return;
const name = document.getElementById('edit_name_'+id).value.trim();
if(!name){showToast('物品名称不能为空');return}
const qty = parseInt(document.getElementById('edit_qty_'+id).value)||1;
const transport = document.getElementById('edit_transport_'+id).value;
const category = document.getElementById('edit_category_'+id).value;
const notes = document.getElementById('edit_notes_'+id).value.trim();

item.quantity = qty;
item.title = qty > 1 ? name + ' ×' + qty : name;
item.transport = transport;

renderChecklistInline();

function addChecklistItem(){
const input = document.getElementById('checklistInput');
if(!input) return;
const name = input.value.trim();
if(!name){showToast('请输入物品名称');return}
const qty = parseInt(document.getElementById('checklistQty')?.value)||1;
const transport = document.getElementById('checklistTransport')?.value||'行李携带';
const category = document.getElementById('checklistCategory')?.value||'其他';
const notes = document.getElementById('checklistNotes')?.value.trim()||'';
const catItems = checklist.filter(c=>(c.category||'其他')===category);
const maxOrder = catItems.reduce((m,c)=>Math.max(m, c.order!==undefined?c.order:(c.createdAt||0)), 0);
checklist.push({
id: genId(),
title: qty > 1 ? name + ' ×' + qty : name,
name: name,
done: false,
category: category,
transport: transport,
quantity: qty,
notes: notes,
order: maxOrder + 1,
createdAt: Date.now()
});
saveData();
showChecklistAddForm();
showToast('已添加');
}

function toggleChecklistItem(id){
const item = checklist.find(c=>c.id===id);
if(!item) return;
item.done = !item.done;
saveData();
renderChecklist();
if(item.done) showToast('已完成：'+item.title);
}

// ============ Drag to reorder checklist ============
let itemDragData = null;

function startItemDrag(e, id){
e.stopPropagation();
e.preventDefault();
const handle = e.currentTarget;
const itemEl = handle.closest('.checklist-item');
if(!itemEl) return;
const item = checklist.find(c=>c.id===id);
if(!item) return;
itemDragData = {
id: id,
el: itemEl,
category: item.category || '其他',
startY: e.clientY,
pointerId: e.pointerId,
moved: false
};
itemEl.classList.add('checklist-dragging');
try { handle.setPointerCapture(e.pointerId); } catch(err){}
document.addEventListener('pointermove', onItemDragMove);
document.addEventListener('pointerup', onItemDragEnd);
document.addEventListener('pointercancel', onItemDragEnd);
}

function onItemDragMove(e){
if(!itemDragData) return;
e.preventDefault();
const dy = e.clientY - itemDragData.startY;
if(Math.abs(dy) > 4) itemDragData.moved = true;
itemDragData.el.style.transform = 'translateY(' + dy + 'px)';

const group = itemDragData.el.parentElement;
const siblings = Array.from(group.querySelectorAll('.checklist-item:not(.checklist-dragging)'));
let insertBefore = null;
for(const sib of siblings){
const r = sib.getBoundingClientRect();
if(e.clientY < r.top + r.height/2){
insertBefore = sib;
break;
}
}
if(insertBefore && insertBefore !== itemDragData.el.nextSibling){
const oldRect = itemDragData.el.getBoundingClientRect();
group.insertBefore(itemDragData.el, insertBefore);
const newRect = itemDragData.el.getBoundingClientRect();
itemDragData.startY += (newRect.top - oldRect.top);
itemDragData.el.style.transform = 'translateY(' + (e.clientY - itemDragData.startY) + 'px)';
} else if(!insertBefore && group.lastElementChild !== itemDragData.el && siblings.length > 0){
const oldRect = itemDragData.el.getBoundingClientRect();
group.appendChild(itemDragData.el);
const newRect = itemDragData.el.getBoundingClientRect();
itemDragData.startY += (newRect.top - oldRect.top);
itemDragData.el.style.transform = 'translateY(' + (e.clientY - itemDragData.startY) + 'px)';
}
}

function onItemDragEnd(e){
if(!itemDragData) return;
document.removeEventListener('pointermove', onItemDragMove);
document.removeEventListener('pointerup', onItemDragEnd);
document.removeEventListener('pointercancel', onItemDragEnd);
itemDragData.el.style.transform = '';
itemDragData.el.classList.remove('checklist-dragging');

if(itemDragData.moved){
const group = itemDragData.el.parentElement;
const itemEls = Array.from(group.querySelectorAll('.checklist-item'));
itemEls.forEach((el, idx)=>{
const it = checklist.find(c=>c.id===el.dataset.id);
if(it) it.order = idx;
});
saveData();
showToast('顺序已更新');
}
itemDragData = null;
}

function setFilter(filter){

// ============ Confirm Dialog ============
let confirmCallback = null;
function showConfirm(text, callback){
document.getElementById('confirmText').textContent = text;
confirmCallback = callback;
document.getElementById('confirmOverlay').classList.add('show');
}
function closeConfirm(){
document.getElementById('confirmOverlay').classList.remove('show');
confirmCallback = null;
}
document.getElementById('confirmOkBtn').onclick = function(){

};

// ============ Utils ============
function esc(str){
if(str === null || str === undefined) return '';
return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function showToast(msg){
const t = document.getElementById('toast');
t.textContent = msg;
t.classList.add('show');
setTimeout(()=>t.classList.remove('show'), 2000);
}

let isSharedView = false;

(async function(){
if(location.search.includes('v=')){
history.replaceState(null,'',location.pathname);
}

// 检测分享链接并加载只读数据
function loadSharedData(){
const hash = location.hash;
if(hash.startsWith('#share=')){
try{
const encoded = hash.substring(7);
const json = decodeURIComponent(escape(atob(encoded)));
const data = JSON.parse(json);
apartments = (data.a||[]).map(s=>({
name:s.n, rent:s.r, area:s.ar, layout:s.l, floor:s.f, orientation:s.o,
commuteTime:s.ct, commuteMethod:s.cm, needTransfer:!!s.tr, subwayLines:s.sl||[],
decoration:s.d, lighting:s.li, noise:s.no, metroDistance:s.md, address:s.ad,
residentCount:s.rc||1, intention:s.i||'pending', needRevisit:!!s.rv, notes:s.nt,
propertyFee:s.pf, tax:s.tx, electricityUnitPrice:s.eu,
waterPrice:s.wp, waterSplit:!!s.ws, coldWaterPrice:s.cwp, hotWaterPrice:s.hwp,
commuteCost:s.cc, discount:s.di, customFees:s.cf||[], scores:s.sc||{price:3,location:3,condition:3,commute:3,surrounding:3},
photos:[], id:'shared_'+Math.random().toString(36).substr(2,9)
}));
if(data.w) weights = data.w;
isSharedView = true;
return true;
}catch(e){ console.error('分享数据解析失败', e); }
}
return false;
}

const hasShare = loadSharedData();
if(!hasShare) await loadData();
render();

if(isSharedView){
document.querySelector('.fab').style.display = 'none';
document.querySelector('.header-right').style.display = 'none';
}
})();

e.preventDefault();
}
}, {passive:false});
